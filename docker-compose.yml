
services:
  db:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_USER: commontrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-not-for-production}
      POSTGRES_DB: commontrace_hub
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-change-me-not-for-production}
    volumes:
      - hub_pgdata18:/var/lib/postgresql
      - ./hub/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commontrace -d commontrace_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["python", "-m", "alembic", "-c", "hub/alembic.ini", "upgrade", "head"]
    environment:
      HUB_DATABASE_URL: postgresql+asyncpg://commontrace:${POSTGRES_PASSWORD:-change-me-not-for-production}@db:5432/commontrace_hub
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  hub:
    build: .
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      HUB_DATABASE_URL: postgresql+asyncpg://commontrace_app:${POSTGRES_APP_PASSWORD:-change-me-not-for-production}@db:5432/commontrace_hub
      HUB_HOST: 0.0.0.0
      HUB_PORT: 8420
      HUB_LOG_LEVEL: INFO
      HUB_ALLOW_INSECURE_HTTP: "true"
      HUB_AUTH_ATTEMPTS_PER_MINUTE: ${HUB_AUTH_ATTEMPTS_PER_MINUTE:-60}
      HUB_AUTH_ATTEMPTS_BURST: ${HUB_AUTH_ATTEMPTS_BURST:-20}
      HUB_READ_RATE_LIMIT_PER_MINUTE: ${HUB_READ_RATE_LIMIT_PER_MINUTE:-300}
      HUB_READ_RATE_LIMIT_BURST: ${HUB_READ_RATE_LIMIT_BURST:-60}
      HUB_CONSOLE_SECRET: ${HUB_CONSOLE_SECRET:-}
      HUB_SIGNUP_ENABLED: ${HUB_SIGNUP_ENABLED:-false}
      HUB_COMMONS_EXPORT_ENABLED: ${HUB_COMMONS_EXPORT_ENABLED:-true}
    ports:
      - "127.0.0.1:8420:8420"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8420/readyz', timeout=5).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Local runtime, opt-in: `docker compose --profile local up`. The gateway serves the
  # console and API on :8787; the MCP server shares its store and bearer token.
  # Settings (e.g. COMMONTRACE_LLM_PROVIDER) come from an optional .env file;
  # see .env.example.
  gateway:
    profiles: ["local"]
    build:
      context: .
      dockerfile: Dockerfile.local
    env_file:
      - path: .env
        required: false
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["gateway", "--host", "0.0.0.0", "--port", "8787"]
    volumes:
      - local_store:/data
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8787/v1/health/ready', timeout=5).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  mcp:
    profiles: ["local"]
    build:
      context: .
      dockerfile: Dockerfile.local
    env_file:
      - path: .env
        required: false
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Plain HTTP is published on loopback only; put TLS in front for anything wider.
    command: ["serve", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8421",
              "--allow-insecure-http", "--allowed-host", "localhost:8421", "--allowed-host", "127.0.0.1:8421"]
    volumes:
      - local_store:/data
    ports:
      - "127.0.0.1:8421:8421"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hub_pgdata18:
  local_store:
