name: Release

# Publishes only from a version tag (vX.Y.Z) whose number matches pyproject.toml,
# through OIDC trusted publishing: no long-lived PyPI or npm token is stored in
# this repository. Configure the "pypi" and "npm" environments (with required
# reviewers) and register this workflow as a trusted publisher before tagging.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify only; publish nothing.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-ci:
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || !inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Require successful CI for the exact release commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_release_ci.py --sha "$(git rev-parse HEAD)"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != pyproject v${version}"; exit 1; }
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build==1.6.1 twine==7.0.0
          python -m build
          python -m twine check --strict dist/*
      - name: Install the wheel into a clean environment and smoke-test it
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-env/bin/unimem --version
          /tmp/wheel-env/bin/unimem init --dest /tmp/smoke-store
          /tmp/wheel-env/bin/unimem --offline doctor --dest /tmp/smoke-store
          PATH="/tmp/wheel-env/bin:$PATH" /tmp/wheel-env/bin/python "$GITHUB_WORKSPACE/scripts/first_recall_smoke.py" --timeout 60
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  build-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Cache checksum-verified OpenAPI Generator
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/openapi-generator-cli-7.26.0.jar
          key: openapi-generator-7.26.0-1760050094997b9cc790cc1350be095f15da8c08a996b184d3eadc4ccda5e35e
      - name: Generate the complete gateway SDK from OpenAPI
        run: |
          python -m pip install -e .
          python scripts/export_openapi.py --check
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          python scripts/generate_sdks.py --api gateway --languages typescript --package-version "$version" --output build/release-sdk
      - name: Compile, smoke-test and pack generated TypeScript
        run: |
          cd build/release-sdk/typescript
          npm install --ignore-scripts
          npm run build
          npm audit --omit=dev --audit-level=high
          npm pack
          consumer="$RUNNER_TEMP/unimem-sdk-consumer"
          mkdir -p "$consumer"
          printf '{"private":true}\n' > "$consumer/package.json"
          npm install --prefix "$consumer" --ignore-scripts "$GITHUB_WORKSPACE"/build/release-sdk/typescript/unimem-sdk-*.tgz
          cd "$GITHUB_WORKSPACE"
          python scripts/smoke_generated_sdk.py "$consumer/node_modules/@unimem/sdk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-dist
          path: build/release-sdk/typescript/*.tgz
          if-no-files-found: error

  publish-pypi:
    needs: [verify-ci, build, build-typescript]
    # A tag ref only: a manual run publishes when started from a vX.Y.Z tag, never from a branch.
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || !inputs.dry_run)
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-npm:
    needs: [verify-ci, build, build-typescript]
    # A tag ref only: a manual run publishes when started from a vX.Y.Z tag, never from a branch.
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || !inputs.dry_run)
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: typescript-dist
          path: pkg/
      - name: Publish with provenance (trusted publishing)
        run: |
          npm install --global npm@11.15.0
          npm publish pkg/*.tgz --provenance --access public
