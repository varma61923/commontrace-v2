name: Graphify architecture audit
on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths: ['commontrace/**', 'hub/**', 'scripts/graphify_audit.py', '.github/workflows/graphify.yml']
  pull_request:
    paths: ['commontrace/**', 'hub/**', 'scripts/graphify_audit.py']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install "graphifyy[terraform,sql]==0.9.84"
      - run: graphify extract . --code-only --max-workers 2 --out "$RUNNER_TEMP/architecture"
      # Seven console history callbacks are dynamically dispatched and verified
      # by Chromium contracts; they are reviewed reachability candidates.
      # Module budget 311 -> 314: multihop, query_expansion and triplet_search
      # (multi-hop reasoning, query expansion and semantic triplet retrieval);
      # 314 -> 315: causal_gate (contextual Thompson allocation over the holdout).
      - name: Enforce graph integrity and reviewed surface budgets
        run: >-
          python scripts/graphify_audit.py
          --graph "$RUNNER_TEMP/architecture/graphify-out/graph.json"
          --output "$RUNNER_TEMP/architecture/audit.json"
          --source-root . --max-modules 315 --max-unreachable 318
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: graphify-audit
          path: ${{ runner.temp }}/architecture
