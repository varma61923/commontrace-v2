name: Graphify architecture audit
on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths: ['unimem/**', 'hub/**', 'scripts/graphify_audit.py', '.github/workflows/graphify.yml']
  pull_request:
    paths: ['unimem/**', 'hub/**', 'scripts/graphify_audit.py', '.github/workflows/graphify.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install "graphifyy[terraform,sql] @ git+https://github.com/Graphify-Labs/graphify.git@86c57be8204673c2a1b9849a3292a7dd3ab373d8"
      - run: graphify extract . --code-only --max-workers 2 --out "$RUNNER_TEMP/architecture"
      # learning and learning_contract add the reviewed durable learning boundary; see architecture-exploration.md.
      - name: Enforce graph integrity and reviewed surface budgets
        run: >-
          python scripts/graphify_audit.py
          --graph "$RUNNER_TEMP/architecture/graphify-out/graph.json"
          --output "$RUNNER_TEMP/architecture/audit.json"
          --source-root . --max-modules 404 --max-unreachable 318
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: graphify-audit
          path: ${{ runner.temp }}/architecture
