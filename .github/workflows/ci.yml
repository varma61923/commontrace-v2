name: CI

on:
  push:
  pull_request:

jobs:
  test-core:
    # Validates the package as an external user would actually get it: `pip install -e .`
    # with only the one core dependency (PyYAML) — no dev/lint tooling, no [attention] extra.
    name: test (core install, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install commontrace (core, no extras)
        run: python -m pip install -e .

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -q

  test-dev:
    # The `[dev]` extra (pytest + ruff) is what a contributor installs. Also exercises lint.
    name: test + lint (dev extra, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install commontrace with the dev extra
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Lint with ruff
        run: ruff check .

  test-hub:
    # The Hub server (hub/) has a much heavier dependency footprint (SQLAlchemy,
    # asyncpg, Alembic, argon2-cffi, a real Postgres) than the PyYAML-only CLI
    # core, so it gets its own job with its own Postgres service container
    # rather than being folded into test-core/test-dev.
    name: hub tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: commontrace
          POSTGRES_PASSWORD: commontrace
          POSTGRES_DB: commontrace_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HUB_TEST_DATABASE_URL: postgresql+asyncpg://commontrace:commontrace@localhost:5432/commontrace_hub_test
    steps:
      - uses: actions/checkout@v4

      - name: Install postgres client (for createdb)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Hub server dependencies
        run: python -m pip install -r hub/requirements.txt pytest pytest-asyncio

      # Applies every migration to an empty database. The hub/tests/ suite
      # builds its schema from the models (see hub/tests/conftest.py), so
      # without this step a model change with no matching migration would
      # pass CI and only fail on a real deploy.
      - name: Verify migrations apply from scratch
        env:
          HUB_DATABASE_URL: postgresql+asyncpg://commontrace:commontrace@localhost:5432/commontrace_migrations
        run: |
          PGPASSWORD=commontrace createdb -h localhost -U commontrace commontrace_migrations
          python -m alembic -c hub/alembic.ini upgrade head
          # And that models and migrations agree -- catches a model edited
          # without `alembic revision --autogenerate`.
          python -m alembic -c hub/alembic.ini check

      - name: Run Hub tests (including test_tenant_isolation.py)
        run: python -m pytest hub/tests/ -q

  docker-build:
    # The image could not be built where it was authored (no Docker daemon),
    # so CI is the first thing that actually proves it builds and that the
    # server starts inside it. Kept separate from the test jobs: it needs no
    # Python matrix and no database.
    name: docker image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Hub image
        run: docker build -t commontrace-hub:ci .

      - name: Container starts and serves /healthz
        run: |
          # No database configured on purpose: liveness must come up without
          # one (see hub/DEPLOYMENT.md §4). A HUB_DATABASE_URL is still
          # required for the process to boot at all.
          docker run -d --name hub-ci -p 8420:8420 \
            -e HUB_DATABASE_URL=postgresql+asyncpg://nobody:nobody@127.0.0.1:5432/nodb \
            commontrace-hub:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8420/healthz; then echo "healthz OK"; exit 0; fi
            sleep 1
          done
          echo "--- container logs ---"; docker logs hub-ci; exit 1

      - name: Readiness reports unhealthy without a database
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8420/readyz)
          test "$code" = "503" || { echo "expected 503 from /readyz, got $code"; exit 1; }
          echo "readyz correctly reports 503 with no database"

      - name: Clean up
        if: always()
        run: docker rm -f hub-ci || true
