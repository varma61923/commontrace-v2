name: CI

on:
  push:
  pull_request:

# No job below needs to write anything back to the repo, open PRs, or touch
# packages/deployments -- read-only is the least the default GITHUB_TOKEN can
# be scoped to, rather than inheriting whatever broad default the
# organization/repo settings happen to grant. A job that genuinely needs
# more (e.g. to comment on a PR) should declare that narrower permission on
# itself, not rely on this file falling back to "everything".
permissions:
  contents: read

jobs:
  test-core:
    # Validates the package as an external user would actually get it: `pip install -e .`
    # with only the one core dependency (PyYAML) — no dev/lint tooling, no [attention] extra.
    name: test (core install, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install commontrace (core, no extras)
        run: python -m pip install -e .

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -q

  test-dev:
    # The `[dev]` extra (pytest + ruff) is what a contributor installs. Also exercises lint.
    name: test + lint (dev extra, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install commontrace with the dev extra
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Lint with ruff
        run: ruff check .

      # A pure-stdlib AST check (no DB, no heavy deps -- see its own
      # docstring), so it belongs in the fast job that runs on every push
      # rather than waiting on test-hub's Postgres-backed job to give the
      # same feedback minutes later. --noconftest: hub/tests/conftest.py
      # (loaded automatically for anything under hub/tests/, regardless of
      # which specific file is targeted) imports sqlalchemy at module
      # level, which this job's core `.[dev]` install never pulls in --
      # this test itself needs none of that conftest's fixtures, so skip
      # loading it rather than installing hub/'s whole dependency stack
      # just to satisfy an import this test doesn't use.
      - name: Hub server image allowlist stays in sync with hub/'s imports
        run: python -m pytest hub/tests/test_image_contents.py -q --noconftest

  test-hub:
    # The Hub server (hub/) has a much heavier dependency footprint (SQLAlchemy,
    # asyncpg, Alembic, argon2-cffi, a real Postgres) than the PyYAML-only CLI
    # core, so it gets its own job with its own Postgres service container
    # rather than being folded into test-core/test-dev.
    name: hub tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: commontrace
          POSTGRES_PASSWORD: commontrace
          POSTGRES_DB: commontrace_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HUB_TEST_DATABASE_URL: postgresql+asyncpg://commontrace:commontrace@localhost:5432/commontrace_hub_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install postgres client (for createdb)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Hub server dependencies
        run: python -m pip install -r hub/requirements.txt pytest pytest-asyncio

      # Applies every migration to an empty database. The hub/tests/ suite
      # builds its schema from the models (see hub/tests/conftest.py), so
      # without this step a model change with no matching migration would
      # pass CI and only fail on a real deploy.
      - name: Verify migrations apply from scratch
        env:
          HUB_DATABASE_URL: postgresql+asyncpg://commontrace:commontrace@localhost:5432/commontrace_migrations
        run: |
          PGPASSWORD=commontrace createdb -h localhost -U commontrace commontrace_migrations
          python -m alembic -c hub/alembic.ini upgrade head
          # And that models and migrations agree -- catches a model edited
          # without `alembic revision --autogenerate`.
          python -m alembic -c hub/alembic.ini check

      # 7c4a1d92e5b8 and 8f2b40c17ade each build a CONCURRENTLY index inside
      # its own op.get_context().autocommit_block() -- which unconditionally
      # commits whatever transaction precedes it, so that migration's
      # add_column(s) (and, for 8f2b40c17ade, its backfill UPDATE) are
      # committed for good the instant the block is entered, independent of
      # whether the index build that follows ever finishes. A process killed
      # mid-build (deploy timeout, OOM, an operator's Ctrl-C) then leaves
      # alembic_version stuck one revision behind with those columns already
      # present -- exactly the state simulated below by hand -- and a plain
      # retry must self-heal rather than fail with a duplicate-column error.
      - name: Verify an interrupted CONCURRENTLY-index migration can be retried
        env:
          HUB_DATABASE_URL: postgresql+asyncpg://commontrace:commontrace@localhost:5432/commontrace_migrations_retry
          PGPASSWORD: commontrace
        run: |
          createdb -h localhost -U commontrace commontrace_migrations_retry

          python -m alembic -c hub/alembic.ini upgrade 40d3f29cbb24
          psql -h localhost -U commontrace -d commontrace_migrations_retry \
            -c "ALTER TABLE traces ADD COLUMN agent_id VARCHAR(128) NOT NULL DEFAULT '';"
          python -m alembic -c hub/alembic.ini upgrade head

          python -m alembic -c hub/alembic.ini downgrade 3c3adaa53a71
          psql -h localhost -U commontrace -d commontrace_migrations_retry -c "
            ALTER TABLE traces ADD COLUMN commons_votes BIGINT NOT NULL DEFAULT 0;
            ALTER TABLE traces ADD COLUMN commons_review_after TIMESTAMPTZ;
            ALTER TABLE traces ADD COLUMN commons_retracted_at TIMESTAMPTZ;
            ALTER TABLE traces ADD COLUMN commons_retraction_reason VARCHAR(200) NOT NULL DEFAULT '';
          "
          python -m alembic -c hub/alembic.ini upgrade head
          python -m alembic -c hub/alembic.ini check

      - name: Run Hub tests (including test_tenant_isolation.py)
        run: python -m pytest hub/tests/ -q

  security-scan:
    # Static security scanning and known-CVE dependency auditing for the
    # project's actual dependencies -- neither ran in CI before this job
    # existed, so a new Medium+ bandit finding or a newly disclosed CVE in
    # a pinned dependency could land and sit unnoticed indefinitely.
    name: security scan (bandit, pip-audit, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install commontrace with every extra, plus the Hub's own dependencies
        run: |
          python -m pip install -e ".[attention,hub-sync,dev]"
          python -m pip install -r hub/requirements.txt
          python -m pip install bandit pip-audit mypy

      # -x excludes tests/: B101 (assert_used) fires on every pytest
      # `assert` statement, which is normal test code, not a finding. -ll
      # gates on Medium+ severity -- Low-severity style findings (e.g.
      # B311's "don't use random.Random for crypto" on overlap.py's
      # deterministic, non-secret MinHash permutation seed) stay visible
      # in a full local run but don't fail the build over a non-issue.
      - name: Bandit static analysis
        run: bandit -r commontrace/ hub/ memory/ -x "*/tests/*,*/test_*" -ll

      # A bare `pip-audit` scans every installed package in the active
      # environment, including pip/setuptools/wheel themselves -- so a CVE
      # in ambient build tooling that ships nowhere near a customer's
      # commontrace install would fail this job for a reason unrelated to
      # any dependency this project actually declares. Scoped to exactly
      # what pyproject.toml's [project.dependencies] and
      # [project.optional-dependencies] list instead, the same
      # pinned-file pattern hub/requirements.txt already uses below.
      - name: pip-audit -- commontrace's own declared dependencies
        run: |
          # Read straight from pyproject.toml's own [project.dependencies]
          # and [project.optional-dependencies], instead of a hand-typed
          # copy of them: the copy had already drifted from the real
          # bounds (e.g. an unconstrained `httpx`/`transformers` here vs.
          # `httpx>=0.27.0`/`transformers>=5.5.0,<7.0` actually declared),
          # so tightening or loosening a real dependency bound silently
          # stopped being reflected in what this step audits. Reading the
          # single source of truth at run time makes that drift structurally
          # impossible instead of relying on someone remembering to update
          # both places in lockstep.
          python - <<'PY' > /tmp/commontrace-audit-requirements.txt
          import tomllib
          with open("pyproject.toml", "rb") as f:
              project = tomllib.load(f)["project"]
          deps = list(project.get("dependencies", []))
          for extra_deps in project.get("optional-dependencies", {}).values():
              deps.extend(extra_deps)
          print("\n".join(deps))
          PY
          pip-audit -r /tmp/commontrace-audit-requirements.txt

      - name: pip-audit -- the Hub server's pinned dependencies
        run: pip-audit -r hub/requirements.txt

      # Informational, not gated: this surfaces genuine pre-existing type
      # errors this one CI job does not attempt to clear in a single pass,
      # so it must not fail the build -- the same "visible rather than
      # silently ignored" policy this repo already applies elsewhere (see
      # bench_cmd.py's unimplemented --threshold-* flags). Tightening this
      # to a real gate is follow-up work, deliberately not bundled in here.
      - name: mypy (known findings, informational only)
        continue-on-error: true
        run: mypy commontrace/ hub/ --ignore-missing-imports

  docker-build:
    # The image could not be built where it was authored (no Docker daemon),
    # so CI is the first thing that actually proves it builds and that the
    # server starts inside it. Kept separate from the test jobs: it needs no
    # Python matrix and no database.
    name: docker image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the Hub image
        run: docker build -t commontrace-hub:ci .

      - name: Container starts and serves /healthz
        run: |
          # No database configured on purpose: liveness must come up without
          # one (see hub/DEPLOYMENT.md §4). A HUB_DATABASE_URL is still
          # required for the process to boot at all.
          #
          # HUB_ALLOW_INSECURE_HTTP=true: `-p 8420:8420` publishes the
          # container's port via Docker's NAT, which only forwards traffic
          # to a socket the container binds on 0.0.0.0 -- a bind to
          # 127.0.0.1 *inside* the container is unreachable through that
          # mapping at all. HubConfig.validate_transport_safety()
          # (hub/config.py) correctly refuses to start on a non-loopback
          # HUB_HOST serving plain HTTP unless this is set, exactly as it
          # should for a real deployment; here it's the same acknowledgment
          # docker-compose.yml already makes for the same Docker-NAT
          # reason, on an isolated CI runner with nothing but this curl
          # loop able to reach the published port at all.
          docker run -d --name hub-ci -p 8420:8420 \
            -e HUB_DATABASE_URL=postgresql+asyncpg://nobody:nobody@127.0.0.1:5432/nodb \
            -e HUB_ALLOW_INSECURE_HTTP=true \
            commontrace-hub:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8420/healthz; then echo "healthz OK"; exit 0; fi
            sleep 1
          done
          echo "--- container logs ---"; docker logs hub-ci; exit 1

      - name: Readiness reports unhealthy without a database
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8420/readyz)
          test "$code" = "503" || { echo "expected 503 from /readyz, got $code"; exit 1; }
          echo "readyz correctly reports 503 with no database"

      - name: Clean up
        if: always()
        run: docker rm -f hub-ci || true

  compose-stack:
    # The deployment path a customer actually follows, end to end: bring the
    # documented stack up, let the one-shot migration gate the app, then drive
    # the running server over real HTTP through the published port. Every
    # other job tests a piece -- this is the only one that proves the pieces
    # compose. It was the last remaining "verified by hand, not by CI" caveat
    # in hub/DEPLOYMENT.md.
    name: docker compose stack serves real MCP traffic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bring up the documented stack
        env:
          # The smoke check a few steps down issues its own real traffic
          # from one source address: the primary org's round trip (tool
          # listing, contribute, search x2, get, vote, amend x2, list_tags,
          # account_usage) plus the second org's tenant-isolation round
          # (initialize, get/vote/amend, commons_overlap) -- close enough to
          # the documented default HUB_AUTH_ATTEMPTS_BURST=20 that this job
          # has hit it directly (reproduced: a live CI run returned 429 on
          # commons_overlap and on session termination from exactly this
          # traffic). Widened here ONLY, via docker-compose.yml's
          # ${VAR:-default} overrides, so this job verifies the deployment
          # path works rather than fighting its own smoke check's request
          # volume -- a real deployment run with `docker compose up` and
          # nothing set in its environment still gets the tighter documented
          # defaults unchanged.
          HUB_AUTH_ATTEMPTS_PER_MINUTE: "600"
          HUB_AUTH_ATTEMPTS_BURST: "200"
          HUB_READ_RATE_LIMIT_PER_MINUTE: "3000"
          HUB_READ_RATE_LIMIT_BURST: "600"
        run: |
          docker compose up -d --build
          echo "--- services ---"
          docker compose ps

      - name: Wait for readiness
        run: |
          # /readyz, not /healthz: this must not pass until the database is
          # genuinely reachable, which is the whole point of the split.
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8420/readyz; then echo; echo "ready"; exit 0; fi
            sleep 2
          done
          echo "--- compose ps ---";      docker compose ps
          echo "--- hub logs ---";        docker compose logs hub
          echo "--- migrate logs ---";    docker compose logs migrate
          exit 1

      - name: Migrations actually ran and the schema is present
        run: |
          docker compose exec -T db psql -U commontrace -d commontrace_hub -c '\dt' | tee /tmp/tables.txt
          for table in organizations api_keys traces votes trace_relations audit_log; do
            grep -q " $table " /tmp/tables.txt || { echo "missing table: $table"; exit 1; }
          done
          echo "all expected tables present"

      - name: Provision two orgs through the operator CLI
        id: provision
        run: |
          set -euo pipefail
          org_a=$(docker compose run --rm -T hub python -m hub.manage create-org "CI Org A" | awk '/org_id/{print $2}')
          org_b=$(docker compose run --rm -T hub python -m hub.manage create-org "CI Org B" | awk '/org_id/{print $2}')
          key_a=$(docker compose run --rm -T hub python -m hub.manage issue-key "$org_a" 30 | grep -o 'ct_live_[A-Za-z0-9_-]*')
          key_b=$(docker compose run --rm -T hub python -m hub.manage issue-key "$org_b" 30 | grep -o 'ct_live_[A-Za-z0-9_-]*')
          test -n "$key_a" && test -n "$key_b"
          echo "::add-mask::$key_a"
          echo "::add-mask::$key_b"
          echo "key_a=$key_a" >> "$GITHUB_OUTPUT"
          echo "key_b=$key_b" >> "$GITHUB_OUTPUT"

      - name: Unauthenticated requests are refused
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8420/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}')
          test "$code" = "401" || { echo "expected 401 without a key, got $code"; exit 1; }
          echo "unauthenticated -> 401"

      - name: Smoke check the live stack over MCP
        env:
          KEY_A: ${{ steps.provision.outputs.key_a }}
          KEY_B: ${{ steps.provision.outputs.key_b }}
        run: |
          python -m pip install --quiet ".[hub-sync]"
          # Two keys, so the tenant-isolation checks actually run rather than
          # being skipped -- isolation is the property worth proving before a
          # customer's data lands in a deployment.
          # --keep: the restart step below asserts traces SURVIVE a restart,
          # and needs some to survive. hub.smoke deletes what it wrote by
          # default (so wiring it into a deploy gate does not accumulate
          # residue in a real org), which would otherwise leave nothing for
          # that check to be about. The default path is exercised by its own
          # step further down.
          python -m hub.smoke \
            --url http://127.0.0.1:8420/mcp \
            --api-key "$KEY_A" \
            --other-api-key "$KEY_B" \
            --keep

      - name: The stack survives a restart with its data intact
        run: |
          # A deploy restarts containers. Traces must still be there, and the
          # named volume is what makes that true.
          before=$(docker compose exec -T db psql -U commontrace -d commontrace_hub -tAc 'SELECT count(*) FROM traces')
          docker compose restart hub
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8420/readyz >/dev/null && break; sleep 2; done
          after=$(docker compose exec -T db psql -U commontrace -d commontrace_hub -tAc 'SELECT count(*) FROM traces')
          test "$before" = "$after" || { echo "trace count changed across restart: $before -> $after"; exit 1; }
          test "$after" -gt 0 || { echo "expected traces to exist after the --keep smoke run"; exit 1; }
          echo "$after trace(s) survived the restart"

      - name: hub.smoke cleans up after itself by default
        env:
          KEY_A: ${{ steps.provision.outputs.key_a }}
        run: |
          # The shipped default. Section 12 tells operators this check is
          # safe to run against production, which invites putting it in a
          # deploy gate -- so every run leaving two un-quarantined traces
          # behind would slowly fill a real org's corpus with the check's
          # own residue, where real agent searches return it and it counts
          # against the org's plan storage.
          before=$(docker compose exec -T db psql -U commontrace -d commontrace_hub -tAc 'SELECT count(*) FROM traces')
          python -m hub.smoke --url http://127.0.0.1:8420/mcp --api-key "$KEY_A"
          after=$(docker compose exec -T db psql -U commontrace -d commontrace_hub -tAc 'SELECT count(*) FROM traces')
          test "$before" = "$after" || {
            echo "hub.smoke left $((after - before)) trace(s) behind; it must clean up unless --keep is passed"
            exit 1
          }
          echo "smoke run left no residue ($after trace(s), unchanged)"

      - name: Logs are structured JSON, and carry no secrets
        run: |
          docker compose logs hub --no-log-prefix > /tmp/hub.log
          python - <<'PY'
          import json, sys
          lines = [l for l in open("/tmp/hub.log") if l.strip().startswith("{")]
          assert lines, "no JSON log lines found -- structured logging is not active"
          for line in lines:
              json.loads(line)          # every one must parse
          body = open("/tmp/hub.log").read()
          assert "ct_live_" not in body, "an API key was written to the logs"
          assert "change-me-not-for-production" not in body, "the database password was logged"
          print(f"{len(lines)} structured log line(s), no credentials present")
          PY

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
