name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test-core:
    name: test (core install, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install commontrace (core, no extras)
        run: python -m pip install -e .

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest tests/ e2e_tests/ -q

  test-dev:
    name: test + lint (dev extra, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install commontrace with the dev extra
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ e2e_tests/ -q

      - name: Lint with ruff
        run: ruff check .

      - name: Source-derived API and environment references stay current
        run: python scripts/dev.py docs --check

      - name: Hub server image allowlist stays in sync with hub/'s imports
        run: python -m pytest hub/tests/test_image_contents.py -q --noconftest

  perf-gate:
    name: perf gate (local-tier retrieval latency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install commontrace (core, no extras)
        run: python -m pip install -e .

      - name: Local-tier retrieval must not regress back to O(N) re-parsing or re-indexing
        run: |
          python -m commontrace.reference.measure_local_latency \
            --sizes 100,400,1600,6400 --runs 3 \
            --max-total-ms 500 --max-alpha 1.5

  sdk-typescript:
    name: sdk (typescript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install (from the committed lockfile)
        run: npm ci

      - name: Build and run the test suite
        run: npm test

  test-vector-engines:
    name: vector engines (SQLite + pgvector, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    services:
      pgvector:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_USER: commontrace
          POSTGRES_PASSWORD: commontrace
          POSTGRES_DB: commontrace_vector_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      COMMONTRACE_TEST_PGVECTOR_DSN: postgresql://commontrace:commontrace@127.0.0.1:5432/commontrace_vector_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the optional PostgreSQL engine and test runner
        run: python -m pip install -e ".[dev,vector-postgres]" "numpy>=1.24,<3.0"
      - name: Provision pgvector as the test database administrator
        run: >-
          docker exec ${{ job.services.pgvector.id }}
          psql -U commontrace -d commontrace_vector_test -v ON_ERROR_STOP=1
          -c 'CREATE EXTENSION IF NOT EXISTS vector;'
      - name: Exercise both engines through real retrieval and concurrent ingestion
        run: >-
          python -m pytest tests/test_vector_store.py
          tests/test_conversation_vector_backend.py tests/test_async_conversation_store.py
          tests/test_concurrent_agent_ingestion.py -q

  test-hub:
    name: hub tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: commontrace
          POSTGRES_PASSWORD: commontrace
          POSTGRES_DB: commontrace_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HUB_TEST_DATABASE_URL: postgresql+asyncpg://commontrace:commontrace@localhost:5432/commontrace_hub_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install postgres client (for createdb)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Hub server dependencies and the client package
        run: python -m pip install -e . -r hub/requirements.txt pytest pytest-asyncio

      - name: Verify migrations apply from scratch
        env:
          HUB_DATABASE_URL: postgresql+asyncpg://commontrace:commontrace@localhost:5432/commontrace_migrations
        run: |
          PGPASSWORD=commontrace createdb -h localhost -U commontrace commontrace_migrations
          python -m alembic -c hub/alembic.ini upgrade head
          python -m alembic -c hub/alembic.ini check

      - name: Verify an interrupted CONCURRENTLY-index migration can be retried
        env:
          HUB_DATABASE_URL: postgresql+asyncpg://commontrace:commontrace@localhost:5432/commontrace_migrations_retry
          PGPASSWORD: commontrace
        run: |
          createdb -h localhost -U commontrace commontrace_migrations_retry

          python -m alembic -c hub/alembic.ini upgrade 40d3f29cbb24
          psql -h localhost -U commontrace -d commontrace_migrations_retry \
            -c "ALTER TABLE traces ADD COLUMN agent_id VARCHAR(128) NOT NULL DEFAULT '';"
          python -m alembic -c hub/alembic.ini upgrade head

          python -m alembic -c hub/alembic.ini downgrade 3c3adaa53a71
          psql -h localhost -U commontrace -d commontrace_migrations_retry -c "
            ALTER TABLE traces ADD COLUMN commons_votes BIGINT NOT NULL DEFAULT 0;
            ALTER TABLE traces ADD COLUMN commons_review_after TIMESTAMPTZ;
            ALTER TABLE traces ADD COLUMN commons_retracted_at TIMESTAMPTZ;
            ALTER TABLE traces ADD COLUMN commons_retraction_reason VARCHAR(200) NOT NULL DEFAULT '';
          "
          python -m alembic -c hub/alembic.ini upgrade head
          python -m alembic -c hub/alembic.ini check

      - name: Run Hub tests (including test_tenant_isolation.py)
        run: python -m pytest hub/tests/ -q

      - name: Run Hub end-to-end scenarios
        run: python -m pytest e2e_tests/ -q -k hub

  security-scan:
    name: security scan (bandit, pip-audit, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install commontrace with every extra, plus the Hub's own dependencies
        run: |
          python -m pip install -e ".[attention,hub-sync,dev]"
          python -m pip install -r hub/requirements.txt
          python -m pip install bandit pip-audit mypy

      - name: Bandit static analysis
        run: bandit -r commontrace/ hub/ memory/ -x "*/tests/*,*/test_*" -ll

      - name: pip-audit -- commontrace's own declared dependencies
        run: |
          python - <<'PY' > /tmp/commontrace-audit-requirements.txt
          import tomllib
          with open("pyproject.toml", "rb") as f:
              project = tomllib.load(f)["project"]
          deps = list(project.get("dependencies", []))
          for extra_deps in project.get("optional-dependencies", {}).values():
              deps.extend(extra_deps)
          print("\n".join(deps))
          PY
          pip-audit -r /tmp/commontrace-audit-requirements.txt

      - name: pip-audit -- the Hub server's pinned dependencies
        run: pip-audit -r hub/requirements.txt

      - name: Strict types for memory boundaries and async runtime
        run: |
          mypy --strict --follow-imports=silent --ignore-missing-imports \
            commontrace/async_workers.py commontrace/mcp_transport.py \
            commontrace/commons_integrity.py commontrace/frameworks.py \
            commontrace/conversation/async_store.py commontrace/conversation/validation.py \
            commontrace/semantic.py commontrace/vector_store.py \
            commontrace/distill.py commontrace/distillation_worker.py commontrace/draft_quality.py \
            commontrace/failure_signals.py commontrace/memory_blocks.py \
            commontrace/commands/block_cmd.py commontrace/commands/distill_cmd.py

      - name: mypy (known findings, informational only)
        continue-on-error: true
        run: mypy commontrace/ hub/ --ignore-missing-imports

  deploy-assets:
    name: helm and terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned helm and terraform
        run: |
          curl -sSfL -o helm.tgz https://get.helm.sh/helm-v3.16.2-linux-amd64.tar.gz
          echo "9318379b847e333460d33d291d4c088156299a26cd93d570a7f5d0c36e50b5bb  helm.tgz" | sha256sum -c -
          tar xzf helm.tgz && sudo mv linux-amd64/helm /usr/local/bin/helm
          curl -sSfL -o tf.zip https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
          echo "186e0145f5e5f2eb97cbd785bc78f21bae4ef15119349f6ad4fa535b83b10df8  tf.zip" | sha256sum -c -
          unzip -q tf.zip && sudo mv terraform /usr/local/bin/terraform

      - name: Lint and render the chart (defaults, and every optional template on)
        run: |
          A="--set image.repository=registry.example/hub --set image.tag=1.0.0 --set existingSecret=hub-secrets"
          helm lint deploy/helm/commontrace-hub $A
          helm template t deploy/helm/commontrace-hub $A >/dev/null
          helm template t deploy/helm/commontrace-hub $A --set metrics.alerts=true --set metrics.serviceMonitor=true \
            --set networkPolicy.enabled=true --set ingress.enabled=true --set ingress.host=h.example \
            --set autoscaling.enabled=true --set postgres.maxConnections=200 >/dev/null

      - name: Validate Terraform
        run: |
          for d in deploy/terraform/aws deploy/terraform/gcp; do
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            terraform -chdir="$d" fmt -check
          done

  docker-build:
    name: docker image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the Hub image
        run: docker build -t commontrace-hub:ci .

      - name: Scan the image for known vulnerabilities (Trivy)
        run: |
          TRIVY=aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" \
            image --scanners vuln --ignore-unfixed --severity HIGH --exit-code 0 \
            --no-progress commontrace-hub:ci
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" \
            image --scanners vuln --ignore-unfixed --severity CRITICAL --exit-code 1 \
            --no-progress commontrace-hub:ci

      - name: Container starts and serves /healthz
        run: |
          docker run -d --name hub-ci -p 8420:8420 \
            -e HUB_DATABASE_URL=postgresql+asyncpg://nobody:nobody@127.0.0.1:5432/nodb \
            -e HUB_ALLOW_INSECURE_HTTP=true \
            commontrace-hub:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8420/healthz; then echo "healthz OK"; exit 0; fi
            sleep 1
          done
          echo "--- container logs ---"; docker logs hub-ci; exit 1

      - name: Readiness reports unhealthy without a database
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8420/readyz)
          test "$code" = "503" || { echo "expected 503 from /readyz, got $code"; exit 1; }
          echo "readyz correctly reports 503 with no database"

      - name: Clean up
        if: always()
        run: docker rm -f hub-ci || true

  compose-stack:
    name: docker compose stack serves real MCP traffic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bring up the documented stack
        env:
          HUB_AUTH_ATTEMPTS_PER_MINUTE: "600"
          HUB_AUTH_ATTEMPTS_BURST: "200"
          HUB_READ_RATE_LIMIT_PER_MINUTE: "3000"
          HUB_READ_RATE_LIMIT_BURST: "600"
          HUB_CONSOLE_SECRET: "ci-test-console-secret-not-for-production"
          HUB_SIGNUP_ENABLED: "true"
        run: |
          docker compose up -d --build
          echo "--- services ---"
          docker compose ps

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8420/readyz; then echo; echo "ready"; exit 0; fi
            sleep 2
          done
          echo "--- compose ps ---";      docker compose ps
          echo "--- hub logs ---";        docker compose logs hub
          echo "--- migrate logs ---";    docker compose logs migrate
          exit 1

      - name: Migrations actually ran and the schema is present
        run: |
          docker compose exec -T db psql -U commontrace -d commontrace_hub -c '\dt' | tee /tmp/tables.txt
          for table in organizations api_keys traces votes trace_relations audit_log; do
            grep -q " $table " /tmp/tables.txt || { echo "missing table: $table"; exit 1; }
          done
          echo "all expected tables present"

      - name: Provision two orgs through the operator CLI
        id: provision
        run: |
          set -euo pipefail
          org_a=$(docker compose run --rm -T hub python -m hub.manage create-org "CI Org A" | awk '/org_id/{print $2}')
          org_b=$(docker compose run --rm -T hub python -m hub.manage create-org "CI Org B" | awk '/org_id/{print $2}')
          key_a=$(docker compose run --rm -T hub python -m hub.manage issue-key "$org_a" 30 | grep -o 'ct_live_[A-Za-z0-9_-]*')
          key_b=$(docker compose run --rm -T hub python -m hub.manage issue-key "$org_b" 30 | grep -o 'ct_live_[A-Za-z0-9_-]*')
          test -n "$key_a" && test -n "$key_b"
          echo "::add-mask::$key_a"
          echo "::add-mask::$key_b"
          echo "key_a=$key_a" >> "$GITHUB_OUTPUT"
          echo "key_b=$key_b" >> "$GITHUB_OUTPUT"

      - name: Unauthenticated requests are refused
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8420/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}')
          test "$code" = "401" || { echo "expected 401 without a key, got $code"; exit 1; }
          echo "unauthenticated -> 401"

      - name: Self-serve signup and console sign-in work over real HTTP
        run: |
          set -euo pipefail

          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8420/signup)
          test "$code" = "200" || { echo "GET /signup: expected 200, got $code"; exit 1; }

          body=$(curl -s -X POST http://127.0.0.1:8420/signup --data-urlencode "org_name=CI Signup Org")
          raw_key=$(echo "$body" | grep -oE 'ct_live_[A-Za-z0-9_-]+' | head -1)
          test -n "$raw_key" || { echo "signup response carried no api key:"; echo "$body"; exit 1; }
          echo "::add-mask::$raw_key"
          echo "self-serve signup issued a key"

          resp=$(curl -s -D - -o /dev/null http://127.0.0.1:8420/app)
          echo "$resp" | grep -qi '^HTTP/[0-9.]* 303' \
            || { echo "GET /app with no session: expected 303"; echo "$resp"; exit 1; }
          echo "$resp" | grep -qi '^location:.*/app/signin' \
            || { echo "GET /app with no session: expected a redirect to /app/signin"; echo "$resp"; exit 1; }

          cookie_jar=$(mktemp)
          signin_code=$(curl -s -o /dev/null -w '%{http_code}' -c "$cookie_jar" \
            http://127.0.0.1:8420/app/signin -X POST --data-urlencode "api_key=$raw_key")
          test "$signin_code" = "303" || { echo "POST /app/signin: expected 303, got $signin_code"; exit 1; }
          grep -q ct_console "$cookie_jar" || { echo "sign-in set no session cookie"; exit 1; }

          overview_code=$(curl -s -o /dev/null -w '%{http_code}' -b "$cookie_jar" http://127.0.0.1:8420/app)
          test "$overview_code" = "200" || { echo "GET /app with a session: expected 200, got $overview_code"; exit 1; }
          rm -f "$cookie_jar"
          echo "self-serve signup -> console sign-in works end to end, over real HTTP"

      - name: Smoke check the live stack over MCP
        env:
          KEY_A: ${{ steps.provision.outputs.key_a }}
          KEY_B: ${{ steps.provision.outputs.key_b }}
        run: |
          python -m pip install --quiet ".[hub-sync]"
          python -m hub.smoke \
            --url http://127.0.0.1:8420/mcp \
            --api-key "$KEY_A" \
            --other-api-key "$KEY_B" \
            --keep

      - name: The stack survives a restart with its data intact
        run: |
          before=$(docker compose exec -T db psql -U commontrace -d commontrace_hub -tAc 'SELECT count(*) FROM traces')
          docker compose restart hub
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8420/readyz >/dev/null && break; sleep 2; done
          after=$(docker compose exec -T db psql -U commontrace -d commontrace_hub -tAc 'SELECT count(*) FROM traces')
          test "$before" = "$after" || { echo "trace count changed across restart: $before -> $after"; exit 1; }
          test "$after" -gt 0 || { echo "expected traces to exist after the --keep smoke run"; exit 1; }
          echo "$after trace(s) survived the restart"

      - name: hub.smoke cleans up after itself by default
        env:
          KEY_A: ${{ steps.provision.outputs.key_a }}
        run: |
          before=$(docker compose exec -T db psql -U commontrace -d commontrace_hub -tAc 'SELECT count(*) FROM traces')
          python -m hub.smoke --url http://127.0.0.1:8420/mcp --api-key "$KEY_A"
          after=$(docker compose exec -T db psql -U commontrace -d commontrace_hub -tAc 'SELECT count(*) FROM traces')
          test "$before" = "$after" || {
            echo "hub.smoke left $((after - before)) trace(s) behind; it must clean up unless --keep is passed"
            exit 1
          }
          echo "smoke run left no residue ($after trace(s), unchanged)"

      - name: Logs are structured JSON, and carry no secrets
        run: |
          docker compose logs hub --no-log-prefix > /tmp/hub.log
          python - <<'PY'
          import json, sys
          lines = [l for l in open("/tmp/hub.log") if l.strip().startswith("{")]
          assert lines, "no JSON log lines found -- structured logging is not active"
          for line in lines:
              json.loads(line)          # every one must parse
          body = open("/tmp/hub.log").read()
          assert "ct_live_" not in body, "an API key was written to the logs"
          assert "change-me-not-for-production" not in body, "the database password was logged"
          print(f"{len(lines)} structured log line(s), no credentials present")
          PY

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
