name: UniMem security analysis

# Alert #10 (hub/auth.py): HMAC-SHA256 indexes 256-bit random API keys with
# a secret pepper; legacy API-key hashing still uses Argon2id.
# This reviewed false positive does not suppress the query.
paths-ignore:
  - 'tests/**'
  - 'hub/tests/**'
  - 'benchmarks/**'
  - 'scripts/**'

queries:
  - uses: security-extended
