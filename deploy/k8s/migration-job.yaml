apiVersion: batch/v1
kind: Job
metadata:
  name: commontrace-hub-migrate
  labels:
    app: commontrace-hub
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: commontrace-hub
        job: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: REPLACE_ME/commontrace-hub:REPLACE_ME
          command: ["python", "-m", "alembic", "-c", "hub/alembic.ini", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: commontrace-hub-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
