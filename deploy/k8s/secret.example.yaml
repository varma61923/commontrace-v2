# The SHAPE of the Secret deployment.yaml and migration-job.yaml read via
# envFrom, named commontrace-hub-secrets to match both. This file is NOT
# meant to be filled in with real values and applied -- see this
# directory's README, "Secrets", for why (the short version: get real
# values into the cluster through your platform's own secret mechanism,
# never a plaintext Secret manifest committed anywhere).
#
# Generate each real value with the command hub/.env.example documents
# for it:
#   HUB_DATABASE_URL            -- your managed Postgres connection string,
#                                   using the RUNTIME (non-superuser,
#                                   NOSUPERUSER/NOBYPASSRLS) role -- see
#                                   hub/DEPLOYMENT.md §2.1. The Hub refuses
#                                   to start against the owner/superuser
#                                   role without HUB_ALLOW_RLS_BYPASS=true,
#                                   which is a finding, not a fix.
#   HUB_LEDGER_SIGNING_KEY       -- python -c "import secrets; print(secrets.token_urlsafe(32))"
#   HUB_ENCRYPTION_KEY           -- python -m hub.manage generate-encryption-key
#   HUB_API_KEY_PEPPER           -- python -c "import secrets; print(secrets.token_urlsafe(48))"
#   HUB_CONSOLE_SECRET           -- python -c "import secrets; print(secrets.token_urlsafe(48))"
#   HUB_ADMIN_TOKEN              -- your own operator credential; leave the
#                                   key out entirely to keep /admin
#                                   unregistered, per hub/config.py
apiVersion: v1
kind: Secret
metadata:
  name: commontrace-hub-secrets
  labels:
    app: commontrace-hub
type: Opaque
stringData:
  HUB_DATABASE_URL: "postgresql+asyncpg://CHANGE_ME:CHANGE_ME@CHANGE_ME:5432/commontrace_hub"
  HUB_LEDGER_SIGNING_KEY: "CHANGE_ME"
  # Optional -- see hub/DEPLOYMENT.md §4 "Encryption at rest". Omit this
  # key entirely (not an empty string) to leave WebhookEndpoint.url
  # unencrypted, exactly as it is with no HUB_ENCRYPTION_KEY set anywhere.
  HUB_ENCRYPTION_KEY: "CHANGE_ME"
  HUB_API_KEY_PEPPER: "CHANGE_ME"
  # Optional -- omit to leave the customer console (/app) unregistered.
  HUB_CONSOLE_SECRET: "CHANGE_ME"
  # Optional -- omit to leave the operator console (/admin) unregistered.
  HUB_ADMIN_TOKEN: "CHANGE_ME"
