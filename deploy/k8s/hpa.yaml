apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: commontrace-hub
  labels:
    app: commontrace-hub
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: commontrace-hub
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
