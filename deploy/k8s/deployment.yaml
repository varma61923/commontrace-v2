apiVersion: apps/v1
kind: Deployment
metadata:
  name: commontrace-hub
  labels:
    app: commontrace-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commontrace-hub
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: commontrace-hub
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hub
          image: REPLACE_ME/commontrace-hub:REPLACE_ME
          ports:
            - name: http
              containerPort: 8420
          envFrom:
            - configMapRef:
                name: commontrace-hub-config
            - secretRef:
                name: commontrace-hub-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      terminationGracePeriodSeconds: 35  # > HUB_GRACEFUL_SHUTDOWN_SECONDS (30s default)
      volumes:
        - name: tmp
          emptyDir: {}
