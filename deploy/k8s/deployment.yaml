# The Hub server itself. Apply migration-job.yaml to completion first.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commontrace-hub
  labels:
    app: commontrace-hub
spec:
  # Raise deliberately, together with hpa.yaml and configmap.yaml's
  # HUB_DB_POOL_SIZE/HUB_RATE_LIMIT_BACKEND -- see this directory's README
  # "Scaling note" before changing this from 1.
  replicas: 1
  selector:
    matchLabels:
      app: commontrace-hub
  strategy:
    rollingUpdate:
      # A rolling deploy briefly runs old and new replicas together --
      # HUB_DB_POOL_SIZE * (replicas + maxSurge) must still stay under
      # Postgres's max_connections during that window (hub/DEPLOYMENT.md §2).
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: commontrace-hub
    spec:
      # Matches the Dockerfile's own USER hub (uid 10001); made explicit
      # here too so the Pod is refused by a namespace that enforces
      # restricted Pod Security Standards, rather than silently relying on
      # the image alone.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hub
          # Same image, same tag, as migration-job.yaml -- see that file's
          # own comment for why they must match.
          image: REPLACE_ME/commontrace-hub:REPLACE_ME
          ports:
            - name: http
              containerPort: 8420
          envFrom:
            - configMapRef:
                name: commontrace-hub-config
            - secretRef:
                name: commontrace-hub-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Liveness on /healthz, NOT /readyz -- deliberately, matching the
          # Dockerfile's own HEALTHCHECK and its comment: /readyz executes a
          # real database query, and a container orchestrator restarts a pod
          # that fails liveness. Wiring liveness to a database-dependent
          # check means a Postgres blip restarts every replica at once,
          # turning a recoverable outage into a worse one.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness on /readyz -- this IS meant to fail when the database
          # is unreachable, so the Service stops routing to this pod
          # specifically (not restart it) until /readyz passes again.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          # Nothing in the Hub writes to disk at runtime -- state lives in
          # Postgres (Dockerfile's own comment) -- so the root filesystem
          # can stay read-only. tmpfs mounts cover the two directories
          # Python itself may still want to write to.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      terminationGracePeriodSeconds: 35  # > HUB_GRACEFUL_SHUTDOWN_SECONDS (30s default)
      volumes:
        - name: tmp
          emptyDir: {}
