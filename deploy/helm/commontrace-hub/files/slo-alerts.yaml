- name: commontrace-hub-slo
  rules:
    - record: commontrace_hub:error_ratio:rate5m
      expr: |
        sum(rate(commontrace_hub_requests_total{status=~"5.."}[5m]))
        / clamp_min(sum(rate(commontrace_hub_requests_total[5m])), 1e-9)
    - record: commontrace_hub:error_ratio:rate1h
      expr: |
        sum(rate(commontrace_hub_requests_total{status=~"5.."}[1h]))
        / clamp_min(sum(rate(commontrace_hub_requests_total[1h])), 1e-9)
    - record: commontrace_hub:error_ratio:rate30m
      expr: |
        sum(rate(commontrace_hub_requests_total{status=~"5.."}[30m]))
        / clamp_min(sum(rate(commontrace_hub_requests_total[30m])), 1e-9)
    - record: commontrace_hub:error_ratio:rate6h
      expr: |
        sum(rate(commontrace_hub_requests_total{status=~"5.."}[6h]))
        / clamp_min(sum(rate(commontrace_hub_requests_total[6h])), 1e-9)
    - record: commontrace_hub:slow_ratio:rate5m
      expr: |
        1 - sum(rate(commontrace_hub_request_duration_ms_bucket{le="250"}[5m]))
        / clamp_min(sum(rate(commontrace_hub_request_duration_ms_count[5m])), 1e-9)
    - record: commontrace_hub:slow_ratio:rate1h
      expr: |
        1 - sum(rate(commontrace_hub_request_duration_ms_bucket{le="250"}[1h]))
        / clamp_min(sum(rate(commontrace_hub_request_duration_ms_count[1h])), 1e-9)
    - alert: HubAvailabilityFastBurn
      expr: commontrace_hub:error_ratio:rate1h > (14.4 * 0.001) and commontrace_hub:error_ratio:rate5m > (14.4 * 0.001)
      for: 2m
      labels: { severity: page, slo: availability-99.9 }
      annotations:
        summary: "The Hub is spending its 30-day availability budget 14x too fast"
        runbook: "Check /readyz, Postgres connectivity and the last deploy; roll back if it started with one."
    - alert: HubAvailabilitySlowBurn
      expr: commontrace_hub:error_ratio:rate6h > (6 * 0.001) and commontrace_hub:error_ratio:rate30m > (6 * 0.001)
      for: 15m
      labels: { severity: ticket, slo: availability-99.9 }
      annotations:
        summary: "The Hub is steadily erroring above its availability budget"
    - alert: HubLatencyBurn
      expr: commontrace_hub:slow_ratio:rate1h > (6 * 0.05) and commontrace_hub:slow_ratio:rate5m > (6 * 0.05)
      for: 10m
      labels: { severity: ticket, slo: latency-250ms-95 }
      annotations:
        summary: "More than 30% of requests are slower than 250 ms"
    - alert: HubNoTraffic
      expr: sum(rate(commontrace_hub_requests_total[10m])) == 0
      for: 15m
      labels: { severity: ticket, slo: availability-99.9 }
      annotations:
        summary: "The Hub is serving no requests at all (a dead ingress looks like zero errors)"
