{{- if .Values.migrations.enabled }}
# Run to completion BEFORE the new pods start, once per release: N replicas racing the same
# migration on every deploy is a hazard, not a convenience.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "hub.name" . }}-migrate-{{ .Release.Revision }}
  labels: {{- include "hub.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {{- include "hub.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: {{ include "hub.image" . | quote }}
          command: ["python", "-m", "alembic", "-c", "hub/alembic.ini", "upgrade", "head"]
          envFrom:
            - secretRef: { name: {{ include "hub.secret" . }} }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
{{- end }}
