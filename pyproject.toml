[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commontrace"
version = "2.0.0"
description = "CommonTrace Protocol client — capture agent experience, validate lessons, and inject them into any agent platform (Claude Code, Cursor, Devin, Windsurf, generic MCP)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CommonTrace" }]
keywords = ["agents", "llm", "mcp", "memory", "protocol", "fleet-learning"]
dependencies = [
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
# Semantic attention layer (Retriever pre-filter). Optional so `pip install commontrace`
# stays lightweight — no torch download required just to try the protocol.
attention = [
    "numpy>=1.24,<3.0",
    # sentence-transformers pulls in `transformers` transitively; the previous
    # `<5.0` cap (pip-audit, Phase 2 dependency audit) resolved a transformers
    # version with 5 known RCE-class CVEs (PYSEC-2025-217, PYSEC-2026-2288/89/90)
    # in checkpoint/config deserialization, fixed in transformers>=5.5.0. This
    # codebase never loads an attacker-controlled model (memory/attention/query.py
    # only ever loads a hardcoded, trusted model name -- see its own hardening
    # comment), so exploitability here was already low, but pinning to a
    # resolvable, patched range costs nothing.
    "sentence-transformers>=6.0,<7.0",
    # Every other pin in this list carries an upper bound (numpy<3.0,
    # sentence-transformers<7.0 above); this one didn't, so a future
    # transformers major release could resolve here unpinned and break the
    # attention extra's install with no warning. Capped at the same <7.0
    # ceiling as sentence-transformers itself, which this package is always
    # installed alongside -- the two tend to release compatible majors in
    # lockstep, so this is the range sentence-transformers>=6.0,<7.0 is
    # already implicitly tested against upstream.
    "transformers>=5.5.0,<7.0",
]
# `commontrace sync` talking to a CommonTrace Hub (commontrace/hub_client.py).
# Optional for the same reason `attention` is: most users never need it.
# The Hub *server* itself (hub/) is not packaged/distributed by this
# pyproject at all -- see hub/README.md + hub/requirements.txt to run one.
#
# mcp>=2.0,<3.0, not the wider >=1.2 this used to declare: hub_client.py
# imports mcp.ClientSession and mcp.client.streamable_http.
# streamable_http_client, both 2.x-era streamable-HTTP transport APIs the
# Hub server itself is pinned to exactly (mcp==2.0.0, hub/requirements.txt)
# -- an install that resolved a 1.x mcp under the old floor would fail on
# import with a confusing ImportError rather than a clear version
# constraint. Upper-bounded rather than left open-ended for the same
# "don't silently float onto an untested major version" reasoning
# hub/requirements.txt's own header explains.
hub-sync = [
    "mcp>=2.0,<3.0",
    "httpx>=0.27.0,<1.0",
]
# `commontrace serve` -- the LOCAL store over MCP stdio
# (commontrace/mcp_server.py), for agents that cannot run a shell.
#
# Separate from hub-sync even though both need the same SDK, because they are
# different decisions: hub-sync attaches you to someone's Hub over the
# network, this serves your own store on your own machine and never opens a
# socket. An installer who wants agent-native access to their local memory
# should not have to install the Hub client to get it, and vice versa.
# No httpx: stdio has no HTTP.
serve = [
    "mcp>=2.0,<3.0",
]
# `commontrace/otel_exporter.py`'s CommonTraceSpanExporter -- a live
# opentelemetry.sdk.trace.export.SpanExporter that turns completed GenAI
# spans into traces as your own application runs, instead of via
# `commontrace import --source otel <file>`. Optional for the same
# reason hub-sync/serve are: most users never attach an OTel exporter,
# and importing commontrace/otel_exporter.py itself costs nothing --
# only constructing CommonTraceSpanExporter needs the SDK installed.
#
# >=1.20,<2.0: the SDK's export interface (SpanExporter, SpanExportResult,
# Status/StatusCode) has been stable since well before 1.20; the floor is
# a recent-enough release to avoid resolving into pre-stable API
# variants, and the ceiling follows this repo's own "no unbounded pin"
# convention rather than any known incompatibility with a 2.x that does
# not exist yet.
otel = [
    "opentelemetry-sdk>=1.20,<2.0",
]
dev = [
    # >=9.0.3, not the previous >=7.0: every release below 9.0.3, including
    # the newest 8.x (8.4.2), carries a known vulnerability
    # (PYSEC-2026-1845). A wider floor (e.g. >=7.0) still lets a resolver
    # land on 8.4.2, which is exactly what tripped CI's own pip-audit job --
    # it flags any version the specifier permits, not just the one actually
    # installed. The full suite (client + hub) is verified green on
    # pytest 9.1.1.
    "pytest>=9.0.3,<10.0",
    "ruff>=0.4,<1.0",
    # hub/tests/ uses @pytest_asyncio.fixture / async def test_* throughout
    # (hub/tests/conftest.py). CI's hub-tests job already installs this
    # directly (.github/workflows/ci.yml), but a contributor who runs
    # `pip install -e ".[dev]"` and then `pytest hub/tests/` -- the natural
    # thing to try -- got an immediate collection failure with nothing in
    # this extra explaining why.
    #
    # >=1.0, not the previous >=0.23,<1.0: 0.23.3 (the newest, and only
    # resolvable, release under that old ceiling) breaks collection under
    # pytest>=9 with `AttributeError: 'Package' object has no attribute
    # 'obj'` in its own pytest_collectstart hook -- a real incompatibility
    # this same change surfaced by raising the pytest floor above 9.0.3 for
    # the PYSEC-2026-1845 fix above. hub/requirements.txt already installs
    # pytest-asyncio unpinned in CI and resolves 1.4.0 there without issue,
    # so the floor is raised (not just the ceiling widened) to make sure a
    # resolver can't land back on the broken 0.23.3.
    "pytest-asyncio>=1.0,<2.0",
    # tests/test_mcp_server.py drives the local MCP server, including one test
    # that spawns `commontrace serve` as a real subprocess and speaks MCP to
    # it -- the only thing that proves stdout stays clean enough to carry the
    # JSON-RPC framing. Without the SDK those tests skip, which is the right
    # behaviour for a bare install and the wrong one for a contributor who
    # just ran `pip install -e ".[dev]"` and believes the suite is green.
    "mcp>=2.0,<3.0",
    # tests/test_otel_exporter.py drives a real
    # opentelemetry.sdk.trace.TracerProvider + CommonTraceSpanExporter,
    # same "don't let the suite silently skip the real thing" reasoning
    # as the mcp entry above.
    "opentelemetry-sdk>=1.20,<2.0",
]

[project.urls]
Homepage = "https://github.com/denemlabs/commontrace-v2"
Protocol = "https://github.com/denemlabs/commontrace-v2/blob/main/protocol/PROTOCOL.md"

[project.scripts]
commontrace = "commontrace.cli:main"

[tool.setuptools.packages.find]
include = ["commontrace*"]

[tool.setuptools.package-data]
# reference/*.py are executed as subprocesses by `commontrace bench`, not
# imported, so they ship as data rather than as an importable subpackage
# (reference/ deliberately has no __init__.py). Without this the benchmark
# commands only worked from a repo checkout -- a plain `pip install`
# customer could not compute their own pilot metrics.
# fixtures/fields/*.json is the labelled cross-field corpus
# `commontrace bench --retrieval` measures against. It ships for the same
# reason the scripts do: the claim it checks is "retrieval works as well in
# your field as in ours", and a claim a customer cannot re-run on their own
# install is a claim they have to take on trust.
commontrace = ["schemas/*.json", "reference/*.py", "fixtures/fields/*.json"]

[tool.ruff]
line-length = 120
target-version = "py310"
# hub/ worktrees Claude Code may create locally under .claude/ are gitignored
# and not part of the package -- keep them out of lint scope explicitly too.
extend-exclude = [".claude", ".agents", "scratch"]

[tool.ruff.lint]
# An explicit, intentional baseline (pycodestyle errors/warnings, pyflakes,
# isort) rather than whatever ruff's default rule set happens to include on
# a given ruff version -- newer defaults on some ruff releases pull in much
# stricter/opinionated categories (datetime-tz-awareness, blind-except,
# mutable-class-defaults, ...) that represent real, pre-existing style debt
# across this repo unrelated to any one change. CI should fail on a
# deliberately-chosen policy, not silently start failing because a ruff
# upgrade added a new default category.
select = ["E", "F", "W", "I"]
