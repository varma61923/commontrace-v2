[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "commontrace"
version = "2.0.0"
description = "CommonTrace Protocol client — capture agent experience, validate lessons, and inject them into any agent platform (Claude Code, Cursor, Devin, Windsurf, generic MCP)."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
authors = [{ name = "CommonTrace" }]
keywords = ["agents", "llm", "mcp", "memory", "protocol", "fleet-learning"]
dependencies = [
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
providers = ["pydantic>=2.12,<3.0"]
code = ["tree-sitter>=0.25,<0.27", "tree-sitter-typescript>=0.23,<0.24"]
ontology = [
    "jsonschema>=4.23,<5.0",
]
security = [
    "cryptography>=50.0.2,<51",
]
extraction = [
    "gliner>=0.2,<1.0",
]
attention = [
    "numpy>=1.24,<3.0",
    "sentence-transformers>=6.0,<7.0",
    "transformers>=5.5.0,<7.0",
]
fastembed = [
    "fastembed==0.8.0",
    "huggingface-hub>=0.36.2,<2.0",
    "onnxruntime==1.23.2; python_version < '3.14'",
    "onnxruntime==1.30.0; python_version >= '3.14'",
]
hub-sync = [
    "mcp>=2.0,<3.0",
    "httpx>=0.27.0,<1.0",
]
llm = [
    "boto3>=1.35,<2.0",
    "google-genai>=1.0,<3.0",
]
serve = [
    "mcp>=2.0,<3.0",
]
otel = [
    "opentelemetry-sdk>=1.20,<2.0",
]
graph = ["neo4j>=6.0,<7.0", "falkordb>=1.2,<2.0"]
compile = []  # Pluggable open-weight trainers; core ships CPU governance reference only.
robotics = []  # rclpy is installed from the ROS 2 distribution, never eagerly imported.
mcap = ["mcap>=1.2,<2.0"]
lerobot = []  # Metadata/JSONL ingest needs no torch or media decoder.
payments = ["stripe>=11,<15"]
memory-mem0 = ["httpx>=0.27,<1.0"]
memory-zep = ["httpx>=0.27,<1.0"]
memory-graphiti = ["httpx>=0.27,<1.0"]
memory-letta = ["httpx>=0.27,<1.0"]
memory-agentcore = ["httpx>=0.27,<1.0"]
memory-vertex = ["httpx>=0.27,<1.0"]
memory-foundry = ["httpx>=0.27,<1.0"]
memory-anthropic = ["httpx>=0.27,<1.0"]
kv-cache = []  # Provider plugins implement compression.KVReuse; no eager inference dependency.
vector-lance = ["lancedb>=0.40,<1.0"]
vector-postgres = [
    "asyncpg>=0.31,<1.0",
]
dev = [
    "pytest>=9.0.3,<10.0",
    "ruff>=0.4,<1.0",
    "pytest-asyncio>=1.0,<2.0",
    "pytest-xdist>=3.6,<4.0",
    "mcp>=2.0,<3.0",
    "opentelemetry-sdk>=1.20,<2.0",
]

[project.urls]
Homepage = "https://github.com/denemlabs/commontrace-v2"

[project.scripts]
commontrace = "commontrace.cli:main"

[tool.setuptools.packages.find]
include = ["commontrace*"]

[tool.setuptools.package-data]
commontrace = ["schemas/*.json", "configuration.schema.json", "reference/*.py", "fixtures/fields/*.json", "kb_packs/*.jsonl", "ui/*", "conformance_vectors.json", "ontology_typing_model.json"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".claude", ".agents", "scratch", ".agentteam"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "F841"]
"benchmarks/**" = ["E501"]

[tool.pytest.ini_options]
markers = [
    "unit: isolated contract without an externally provisioned service",
    "integration: native driver, SDK or service contract (optional services must be explicitly enabled)",
    "e2e: executable CLI, installer, gateway or browser journey",
]
addopts = "--import-mode=importlib"
pythonpath = ["."]
testpaths = ["tests"]
