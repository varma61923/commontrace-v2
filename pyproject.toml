[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commontrace"
version = "2.0.0"
description = "CommonTrace Protocol client — capture agent experience, validate lessons, and inject them into any agent platform (Claude Code, Cursor, Devin, Windsurf, generic MCP)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CommonTrace" }]
keywords = ["agents", "llm", "mcp", "memory", "protocol", "fleet-learning"]
dependencies = [
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
ontology = [
    "jsonschema>=4.23,<5.0",
]
security = [
    "cryptography>=44,<47",
]
extraction = [
    "gliner>=0.2,<1.0",
]
attention = [
    "numpy>=1.24,<3.0",
    "sentence-transformers>=6.0,<7.0",
    "transformers>=5.5.0,<7.0",
]
hub-sync = [
    "mcp>=2.0,<3.0",
    "httpx>=0.27.0,<1.0",
]
llm = [
    "boto3>=1.35,<2.0",
    "google-genai>=1.0,<3.0",
]
serve = [
    "mcp>=2.0,<3.0",
]
otel = [
    "opentelemetry-sdk>=1.20,<2.0",
]
vector-postgres = [
    "asyncpg>=0.31,<1.0",
]
dev = [
    "pytest>=9.0.3,<10.0",
    "ruff>=0.4,<1.0",
    "pytest-asyncio>=1.0,<2.0",
    "mcp>=2.0,<3.0",
    "opentelemetry-sdk>=1.20,<2.0",
]

[project.urls]
Homepage = "https://github.com/denemlabs/commontrace-v2"
Protocol = "https://github.com/denemlabs/commontrace-v2/blob/main/protocol/PROTOCOL.md"

[project.scripts]
commontrace = "commontrace.cli:main"

[tool.setuptools.packages.find]
include = ["commontrace*"]

[tool.setuptools.package-data]
commontrace = ["schemas/*.json", "reference/*.py", "fixtures/fields/*.json", "kb_packs/*.jsonl", "ui/*", "conformance_vectors.json"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".claude", ".agents", "scratch", ".agentteam"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "F841"]
"benchmarks/**" = ["E501"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["."]
testpaths = ["tests"]
