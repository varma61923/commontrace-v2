name: CommonTrace Store Health
description: Install CommonTrace and verify a workspace memory store without sending data to hosted services.
author: CommonTrace
branding:
  icon: database
  color: blue
inputs:
  store:
    description: Store path relative to the checked-out workspace.
    required: false
    default: '.'
  initialize:
    description: Initialize a new store before checking it (true or false).
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Install the action's CommonTrace version
      shell: bash
      env:
        COMMONTRACE_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install "$COMMONTRACE_ACTION_PATH"
    - name: Validate and check the store
      shell: bash
      env:
        COMMONTRACE_ACTION_STORE: ${{ inputs.store }}
        COMMONTRACE_ACTION_INITIALIZE: ${{ inputs.initialize }}
        COMMONTRACE_ACTION_PATH: ${{ github.action_path }}
      run: python "$COMMONTRACE_ACTION_PATH/distribution/action/check.py"
